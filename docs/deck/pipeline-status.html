<style>

h2 { font-family:"Gowun Batang",serif; font-weight:700; font-size:clamp(1.75rem,3.4vw,2.45rem);

h3 { font-size:1.18rem; font-weight:600; margin:0 0 8px; }
p { margin:0 0 16px; max-width:60ch; font-size:1.2rem; }

.acc { border-left:3px solid var(--oxide); background:var(--oxide-soft);

.fix h3 { color:var(--teal); }
.fix p { margin:0; max-width:64ch; }

.strata { border:1px solid var(--rule); border-radius:3px; overflow:hidden;
  margin:0 0 16px; max-width:68rem; background:var(--card);
  display:grid; grid-template-columns:max-content minmax(0,1fr); }
.strata > div { border-bottom:1px solid var(--rule-soft); padding:13px 18px; }

.flow { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 18px; }
.step { background:var(--card); border:1px solid var(--rule); border-radius:3px;

.step.off { border-style:dashed; color:var(--muted); background:transparent; }
.arrow { color:var(--muted); }

pre { background:var(--card); border:1px solid var(--rule-soft);

code { font-family:"IBM Plex Mono",monospace; font-size:1rem; line-height:1.8; }

.qa { border:1px solid var(--rule); border-left:3px solid var(--ink);

.qa .q { display:flex; gap:12px; margin-bottom:12px; }

.qa .meta { border-top:1px solid var(--rule-soft); padding-top:12px;

.qa .meta div { font-size:1rem; color:var(--muted); }
.qa .meta b { font-family:"IBM Plex Mono",monospace; font-size:.85rem; letter-spacing:.1em;

  text-transform:uppercase; color:var(--teal); font-weight:600; margin-bottom:8px; }
.qa .do p { margin:0; font-size:1.04rem; color:var(--ink); max-width:70ch; }

.tree { border:1px solid var(--rule); border-radius:3px; margin:0 0 20px;

.tree .t { font-family:"IBM Plex Mono",monospace; font-size:1.04rem; font-weight:500;

.tree .hi { background:var(--teal-soft); }

.anat { border:1px solid var(--rule); border-radius:3px; background:var(--card);

.anat .hd .f { font-family:"IBM Plex Mono",monospace; font-size:1.06rem; font-weight:600;
  color:var(--ink); white-space:nowrap; }
.anat .hd .m { font-size:.98rem; color:var(--muted); }
.anat .rows { display:grid; grid-template-columns:max-content max-content minmax(18rem,1fr); }
.anat .rows > div { border-bottom:1px solid var(--rule-soft); }
.anat .rows > div:nth-last-child(-n+3) { border-bottom:0; }
.anat .c-g { padding:10px 16px 10px 18px; }
.anat .c-g .g { display:block; font-size:.76rem; letter-spacing:.04em; font-weight:600;

.g-doc, .g-imp, .g-set { color:var(--muted); background:var(--rule-soft); }

.anat .c-n { font-family:"IBM Plex Mono",monospace; font-size:1rem; color:var(--ink);

.anat .c-d { font-size:1rem; color:var(--muted);

.io { display:grid; grid-template-columns:1fr 2rem 1.15fr 2rem 1fr;

.io .box { border:1px solid var(--rule); border-radius:3px; background:var(--card);

.io .box.mid { border-color:var(--teal); background:var(--teal-soft); }
.io .k { font-size:.78rem; letter-spacing:.1em; color:var(--muted); font-weight:600;
  margin-bottom:8px; }
.io .box.mid .k { color:var(--teal); }
.io ul { margin:0; padding-left:1.05rem; }
.io li { font-size:1.02rem; margin-bottom:3px; max-width:none; }
.io p { margin:0; font-size:1.06rem; max-width:none; }
.io .ar { display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:1.3rem; }

.calls { border:1px solid var(--rule); border-radius:3px; background:var(--card);

.calls { display:grid; grid-template-columns:max-content minmax(0,1fr); }
.calls > div { border-bottom:1px solid var(--rule-soft); }

.calls .s { padding:12px 18px; }
.calls .s b { display:block; font-size:1.04rem; font-weight:600; }
.calls .s span { display:block; font-size:.96rem; color:var(--muted); }
.calls .fns { padding:14px 18px; border-left:1px solid var(--rule-soft);

.calls .none { font-size:1rem; color:var(--muted); }
.fn { font-family:"IBM Plex Mono",monospace; font-size:.95rem; color:var(--teal);

  padding:1px 9px; white-space:nowrap; height:max-content; }
.fn.off { color:var(--muted); background:transparent; border-style:dashed; border-color:var(--rule); }

.groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr));

.groups .gr { border:1px solid var(--rule-soft); border-radius:3px; background:var(--card);

.sig { border:1px solid var(--rule); border-radius:3px; background:var(--card);

.sig > div { border-bottom:1px solid var(--rule-soft); padding:11px 20px; }

.sig .d { font-size:1.02rem; color:var(--muted); border-left:1px solid var(--rule-soft); }

.goals { margin:0 0 18px; max-width:72rem; border-top:1px solid var(--rule); }

table { border-collapse:collapse; width:100%; font-size:1.04rem; }

ul { margin:0 0 14px; padding-left:1.1rem; }
li { margin-bottom:8px; font-size:1.14rem; max-width:60ch; }

.idx { position:fixed; inset:0; background:var(--paper); z-index:20; padding:40px 40px 40px 84px;

.idx.on { display:block; }

@media (max-width:1100px) {

}
@media (max-width:820px) {

  .calls { grid-template-columns:minmax(0,1fr); }

}
@media (max-width:760px) {
  .rail { display:none; }
  .stage { padding:32px 20px 80px; }
  .bar, .prog { left:0; }
  .idx { padding:32px 20px; }
  .anat { font-size:.94rem; }
  .terms, .sig { grid-template-columns:minmax(0,1fr); }
  .terms > div, .sig > div { border-left:0; }
  .idx ol { columns:1; }
}
</style>

function chips(names) {

function block(b) {
  if (b.p) return '<p>' + b.p + '</p>';
  if (b.code) return '<pre class="' + (b.bad ? 'bad' : '') + '"><code>' + b.code + '</code></pre>'
    + (b.cap ? '<p class="cap">' + b.cap + '</p>' : '');
  if (b.acc) return '<div class="acc"><h3>' + b.acc + '</h3><p>' + b.body + '</p></div>';
  if (b.fix) return '<div class="fix"><h3>' + b.fix + '</h3><p>' + b.body + '</p></div>';
  if (b.strata) return '<div class="strata">' + b.strata.map(function (r) {
    var hi = r.hi ? ' hi' : '';
    return '<div class="band-n' + hi + '">' + r.n + '</div>'
      + '<div class="band-d' + hi + '">' + r.d + '</div>';
  }).join('') + '</div>';
  if (b.flow) return '<div class="flow">' + b.flow.map(function (f, i) {
    return (i ? '<span class="arrow">&rarr;</span>' : '')
      + '<span class="step ' + (f.on ? 'on' : (f.off ? 'off' : '')) + '">' + f.t + '</span>';
  }).join('') + '</div>';
  if (b.cards) return '<div class="cards ' + (b.cards.length > 2 ? 'three' : 'two') + '">'
    + b.cards.map(function (c) {
      return '<div class="card">' + (c.k ? '<div class="k">' + c.k + '</div>' : '')
        + (c.h ? '<h3>' + c.h + '</h3>' : '') + '<p>' + c.p + '</p></div>';
    }).join('') + '</div>';
  if (b.vs) return '<div class="vs">' + b.vs.map(function (v) {
    return '<div><div class="eyebrow ' + (v.tone || '') + '">' + v.k + '</div>'
      + (v.code ? '<pre class="' + (v.tone === 'pain' ? 'bad' : '') + '"><code>' + v.code + '</code></pre>' : '')
      + '<p class="sub">' + v.p + '</p></div>';
  }).join('') + '</div>';
  if (b.table) return '<div class="scroll"><table><thead><tr>'
    + b.table.head.map(function (x) { return '<th>' + x + '</th>'; }).join('')
    + '</tr></thead><tbody>' + b.table.rows.map(function (r) {
      return '<tr>' + r.map(function (c, i) {
        var num = i > 0 && /^[0-9$.,%~+→-]+$/.test(String(c));
        return '<td class="' + (num ? 'n' : '') + '">' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
  if (b.qa) return '<div class="qa">'
    + '<div class="q"><span class="mk">Q.</span><p>' + b.qa + '</p></div>'
    + '<div class="a"><span class="mk">A.</span><p>' + b.a + '</p></div>'
    + '<div class="meta"><div><b>근거</b>' + b.src + '</div>'
    + (b.tail ? '<div class="tail"><b>꼬리</b>' + b.tail + '</div>' : '')
    + '</div>'
    + (b.do ? '<div class="do"><div class="k">이렇게 해 두세요</div><p>' + b.do + '</p></div>' : '')
    + '</div>';
  if (b.tree) return '<div class="tree">' + b.tree.map(function (r) {
    if (r.root) return '<div class="root">' + r.t + '</div>';
    var hi = r.hi ? ' hi' : '';
    var off = r.off ? ' off' : '';
    return '<div class="t' + hi + off + '">' + r.t + '</div>'
      + '<div class="d' + hi + off + '">' + (r.d || '') + '</div>';
  }).join('') + '</div>';
  if (b.anat) {
    var LABEL = { doc: '설명글', imp: 'import', set: '설정값', fn: '함수', cls: '클래스', run: '실행문' };
    return '<div class="anat"><div class="hd"><div class="f">' + b.anat.file + '</div>'
      + '<div class="m">' + (b.anat.meta || '') + '</div></div>'
      + '<div class="rows">' + b.anat.rows.map(function (r) {
        return '<div class="c-g"><span class="g g-' + r.g + '">' + (LABEL[r.g] || r.g) + '</span></div>'
          + '<div class="c-n">' + r.n + '</div>'
          + '<div class="c-d">' + (r.d || '') + '</div>';
      }).join('') + '</div></div>';
  }
  if (b.io) return '<div class="io">'
    + '<div class="box"><div class="k">들어오는 것</div><ul>'
    + b.io.in.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>'
    + '<div class="ar">&rarr;</div>'
    + '<div class="box mid"><div class="k">하는 일</div><p>' + b.io.does + '</p></div>'
    + '<div class="ar">&rarr;</div>'
    + '<div class="box"><div class="k">나가는 것</div><ul>'
    + b.io.out.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>'
    + '</div>';
  if (b.calls) return '<div class="calls">' + b.calls.map(function (c) {
    return '<div class="s"><b>' + c.s + '</b>'
      + (c.d ? '<span>' + c.d + '</span>' : '') + '</div>'
      + '<div class="fns">'
      + (c.fns.length ? chips(c.fns) : '<span class="none">부르는 함수 없음</span>')
      + '</div>';
  }).join('') + '</div>';
  if (b.groups) return '<div class="groups">' + b.groups.map(function (g) {
    return '<div class="gr"><h3>' + g.h + '</h3>'
      + '<div class="fns">' + chips(g.fns) + '</div><p>' + g.p + '</p></div>';
  }).join('') + '</div>';
  if (b.goals) return '<div class="goals">' + b.goals.map(function (g) {
    return '<div class="go"><div class="no">' + g.n + '</div><div class="tx">' + g.t + '</div></div>';
  }).join('') + '</div>';
  if (b.sig) {
    var rows = [];
    if (b.sig.in && b.sig.in.length) {
      b.sig.in.forEach(function (x, i) {
        rows.push([i ? '' : '받는 것', x[0], x[1]]);
      });
    } else {
      rows.push(['받는 것', '없음', '인자를 받지 않습니다']);
    }
    b.sig.out.forEach(function (x, i) { rows.push([i ? '' : '돌려주는 것', x[0], x[1]]); });
    return '<div class="sig">' + rows.map(function (r) {
      return '<div class="k">' + r[0] + '</div><div class="v">' + r[1]
        + '</div><div class="d">' + r[2] + '</div>';
    }).join('') + '</div>';
  }
  if (b.terms) return '<div class="terms">' + b.terms.map(function (t) {
    return '<div class="k">' + t.k + '</div><div class="p">' + t.p + '</div>';
  }).join('') + '</div>';
  if (b.list) return '<ul>' + b.list.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
  return '';
}

function render(s) {
  const el = document.createElement('section');
  el.className = 'slide';
  el.setAttribute('aria-hidden', 'true');
  let h = '';
  if (s.eyebrow) h += '<div class="eyebrow ' + (s.tone || '') + '">' + s.eyebrow + '</div>';
  if (s.layout === 'cover') {
    h += '<div class="cover"><div class="num">' + s.num + '</div><h1>' + s.title + '</h1>'
      + (s.lead ? '<p class="lead">' + s.lead + '</p>' : '') + '</div>';
  } else if (s.layout === 'statement') {
    h += '<p class="statement">' + s.text + '</p>'
      + (s.sub ? '<p class="sub" style="margin-top:22px">' + s.sub + '</p>' : '');
  } else {
    if (s.title) h += '<h2' + (s.kind === 'fn' ? ' class="fn-title"' : '') + '>' + s.title + '</h2>';
    if (s.lead) h += '<p class="lead">' + s.lead + '</p>';
    (s.blocks || []).forEach(function (b) { h += block(b); });
  }
  el.innerHTML = h;
  return el;
}

const nodes = S.map(render);
nodes.forEach(function (n) { stage.appendChild(n); });

let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  nodes.forEach(function (n, j) {
    n.classList.toggle('on', j === cur);
    n.setAttribute('aria-hidden', j === cur ? 'false' : 'true');
  });
  prog.style.width = ((cur + 1) / S.length * 100) + '%';
  railno.textContent = cur + 1;
  count.textContent = (cur + 1) + ' / ' + S.length;
  try { localStorage.setItem('deck-safefarm-pipeline', String(cur)); } catch (e) {}
}

document.getElementById('idxlist').innerHTML = S.map(function (s, i) {
  return '<li tabindex="0" data-i="' + i + '" class="' + (s.layout === 'cover' ? 'ch' : '') + '">'
    + '<span>' + (i + 1) + '</span>' + (s.title || s.text || '') + '</li>';
}).join('');
document.getElementById('idxlist').addEventListener('click', function (e) {
  const li = e.target.closest('li'); if (!li) return;
  show(+li.dataset.i); idx.classList.remove('on');
});
document.getElementById('idxlist').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const li = e.target.closest('li'); if (!li) return;
  show(+li.dataset.i); idx.classList.remove('on');
});
document.getElementById('idxbtn').addEventListener('click', function () { idx.classList.toggle('on'); });

document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { show(cur + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); e.preventDefault(); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(S.length - 1);
  if (e.key.toLowerCase() === 'm') idx.classList.toggle('on');
  if (e.key === 'Escape') idx.classList.remove('on');
});

let start = 0;
try { start = Math.min(parseInt(localStorage.getItem('deck-safefarm-pipeline') || '0', 10) || 0, S.length - 1); } catch (e) {}
show(start);
</script>
